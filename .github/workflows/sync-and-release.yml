name: CI/CD

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      pf2e_needed: ${{ steps.pf2e.outputs.needed }}
      pf2e_tag: ${{ steps.pf2e.outputs.tag }}
      sf2e_needed: ${{ steps.sf2e.outputs.needed }}
      sf2e_tag: ${{ steps.sf2e.outputs.tag }}

    steps:
      - name: Check pf2e
        id: pf2e
        run: |
          TAG=$(gh api repos/foundryvtt/pf2e/releases --jq '[.[] | select(.tag_name | startswith("pf2e-"))] | max_by(.published_at) | .tag_name' 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          EXISTING=$(gh release view "$TAG" --repo ${{ github.repository }} --json tagName 2>/dev/null || echo "")
          [ -n "$EXISTING" ] && echo "needed=false" >> "$GITHUB_OUTPUT" || echo "needed=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check sf2e
        id: sf2e
        run: |
          TAG=$(gh api repos/foundryvtt/pf2e/releases --jq '[.[] | select(.tag_name | startswith("sf2e-"))] | max_by(.published_at) | .tag_name' 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          EXISTING=$(gh release view "$TAG" --repo ${{ github.repository }} --json tagName 2>/dev/null || echo "")
          [ -n "$EXISTING" ] && echo "needed=false" >> "$GITHUB_OUTPUT" || echo "needed=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync:
    needs: check
    if: needs.check.outputs.pf2e_needed == 'true' || needs.check.outputs.sf2e_needed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/foundryvtt/pf2e.git || true
          git fetch upstream v13-dev
          git merge upstream/v13-dev --no-edit --allow-unrelated-histories || {
            git checkout --theirs .
            git add .
            git commit --no-edit
          }

      - name: Apply patches
        run: |
          REPO="${{ github.repository }}"

          # 1. Remove forbidden modules block
          python3 -c "
          import re
          with open('src/scripts/hooks/ready.ts', 'r') as f:
              content = f.read()
          pattern = r'\s*// Proceed no further if forbidden modules are enabled\n.*?return;\n\s*\}\n'
          content = re.sub(pattern, '\n', content, flags=re.DOTALL)
          with open('src/scripts/hooks/ready.ts', 'w') as f:
              f.write(content)
          "

          # 2. Rewrite manifest URLs to point to this fork
          python3 << 'PYEOF'
          import json, sys

          repo = "${{ github.repository }}"

          for system in ["pf2e", "sf2e"]:
              path = f"system.{system}.json"
              with open(path) as f:
                  data = json.load(f)

              version = data["version"]
              data["manifest"] = f"https://raw.githubusercontent.com/{repo}/v13-dev/system.{system}.json"
              data["download"] = f"https://github.com/{repo}/releases/download/{system}-{version}/system.zip"
              data["changelog"] = f"https://github.com/{repo}/blob/v13-dev/CHANGELOG.md"
              data["url"] = f"https://github.com/{repo}"
              data["bugs"] = f"https://github.com/{repo}/issues"
              for author in data.get("authors", []):
                  if "url" in author:
                      author["url"] = author["url"].replace("foundryvtt/pf2e", repo)

              with open(path, "w") as f:
                  json.dump(data, f, indent=4, ensure_ascii=False)
                  f.write("\n")
          PYEOF

          git add -A
          git diff --cached --quiet || git commit -m "Apply local configuration"

      - name: Push changes
        run: git push origin

  release-pf2e:
    needs: [check, sync]
    if: needs.check.outputs.pf2e_needed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger and wait
        run: |
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run release.yml --repo ${{ github.repository }} --ref v13-dev -f system=pf2e
          sleep 10
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh api repos/${{ github.repository }}/actions/workflows/release.yml/runs \
              --jq "[.workflow_runs[] | select(.created_at >= \"$BEFORE\" and .display_title == \"System Release\")][0].id" 2>/dev/null || echo "")
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          [ -z "$RUN_ID" ] && { echo "Could not find triggered run"; exit 1; }
          gh run watch "$RUN_ID" --repo ${{ github.repository }} --exit-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy release notes from upstream
        run: |
          TAG="${{ needs.check.outputs.pf2e_tag }}"
          BODY=$(gh release view "$TAG" --repo foundryvtt/pf2e --json body -q .body 2>/dev/null || echo "")
          [ -n "$BODY" ] && echo "$BODY" | gh release edit "$TAG" --repo ${{ github.repository }} --notes-file -
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-sf2e:
    needs: [check, sync]
    if: needs.check.outputs.sf2e_needed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger and wait
        run: |
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run release.yml --repo ${{ github.repository }} --ref v13-dev -f system=sf2e
          sleep 10
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh api repos/${{ github.repository }}/actions/workflows/release.yml/runs \
              --jq "[.workflow_runs[] | select(.created_at >= \"$BEFORE\" and .display_title == \"System Release\")][0].id" 2>/dev/null || echo "")
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          [ -z "$RUN_ID" ] && { echo "Could not find triggered run"; exit 1; }
          gh run watch "$RUN_ID" --repo ${{ github.repository }} --exit-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy release notes from upstream
        run: |
          TAG="${{ needs.check.outputs.sf2e_tag }}"
          BODY=$(gh release view "$TAG" --repo foundryvtt/pf2e --json body -q .body 2>/dev/null || echo "")
          [ -n "$BODY" ] && echo "$BODY" | gh release edit "$TAG" --repo ${{ github.repository }} --notes-file -
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
