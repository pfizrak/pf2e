name: Sync and Release

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-and-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      upstream_branch: ${{ steps.upstream.outputs.branch }}
      pf2e_needed: ${{ steps.pf2e.outputs.needed }}
      pf2e_tag: ${{ steps.pf2e.outputs.tag }}
      sf2e_needed: ${{ steps.sf2e.outputs.needed }}
      sf2e_tag: ${{ steps.sf2e.outputs.tag }}

    steps:
      - name: Resolve upstream branch
        id: upstream
        run: |
          BRANCH=$(gh api repos/foundryvtt/pf2e --jq .default_branch)
          [ -n "$BRANCH" ] || { echo "Could not resolve upstream default branch"; exit 1; }
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check pf2e
        id: pf2e
        run: |
          BRANCH="${{ steps.upstream.outputs.branch }}"
          CONTENT=$(gh api "repos/foundryvtt/pf2e/contents/system.pf2e.json?ref=${BRANCH}" --jq .content | tr -d '\n')
          [ -n "$CONTENT" ] || { echo "Could not read system.pf2e.json from upstream branch ${BRANCH}"; exit 1; }
          VERSION=$(printf "%s" "$CONTENT" | base64 -d | jq -r .version)
          [ -n "$VERSION" ] && [ "$VERSION" != "null" ] || { echo "Could not resolve pf2e version from upstream branch ${BRANCH}"; exit 1; }
          TAG="pf2e-$VERSION"
          UPSTREAM_RELEASE=$(gh release view "$TAG" --repo foundryvtt/pf2e --json tagName --jq .tagName 2>/dev/null || echo "")
          if [ -z "$UPSTREAM_RELEASE" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          EXISTING=$(gh release view "$TAG" --repo ${{ github.repository }} --json tagName 2>/dev/null || echo "")
          [ -n "$EXISTING" ] && echo "needed=false" >> "$GITHUB_OUTPUT" || echo "needed=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check sf2e
        id: sf2e
        run: |
          BRANCH="${{ steps.upstream.outputs.branch }}"
          CONTENT=$(gh api "repos/foundryvtt/pf2e/contents/system.sf2e.json?ref=${BRANCH}" --jq .content | tr -d '\n')
          [ -n "$CONTENT" ] || { echo "Could not read system.sf2e.json from upstream branch ${BRANCH}"; exit 1; }
          VERSION=$(printf "%s" "$CONTENT" | base64 -d | jq -r .version)
          [ -n "$VERSION" ] && [ "$VERSION" != "null" ] || { echo "Could not resolve sf2e version from upstream branch ${BRANCH}"; exit 1; }
          TAG="sf2e-$VERSION"
          UPSTREAM_RELEASE=$(gh release view "$TAG" --repo foundryvtt/pf2e --json tagName --jq .tagName 2>/dev/null || echo "")
          if [ -z "$UPSTREAM_RELEASE" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          EXISTING=$(gh release view "$TAG" --repo ${{ github.repository }} --json tagName 2>/dev/null || echo "")
          [ -n "$EXISTING" ] && echo "needed=false" >> "$GITHUB_OUTPUT" || echo "needed=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync:
    needs: check
    if: needs.check.outputs.pf2e_needed == 'true' || needs.check.outputs.sf2e_needed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Preserve local workflows
        run: |
          mkdir -p /tmp/local-workflows
          cp .github/workflows/ci.yml /tmp/local-workflows/ci.yml
          cp .github/workflows/release.yml /tmp/local-workflows/release.yml
          cp .github/workflows/fork-sync-and-release.yml /tmp/local-workflows/fork-sync-and-release.yml

      - name: Merge upstream without committing
        run: |
          BRANCH="${{ needs.check.outputs.upstream_branch }}"
          [ -n "$BRANCH" ] || { echo "Missing upstream branch output"; exit 1; }
          git remote add upstream https://github.com/foundryvtt/pf2e.git || true
          git fetch upstream "$BRANCH"
          git merge "upstream/$BRANCH" --no-commit --no-ff --allow-unrelated-histories || {
            git checkout --theirs .
            git add -A
          }

      - name: Apply fork patches
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/local-workflows/ci.yml .github/workflows/ci.yml
          cp /tmp/local-workflows/release.yml .github/workflows/release.yml
          cp /tmp/local-workflows/fork-sync-and-release.yml .github/workflows/fork-sync-and-release.yml
          python3 << 'PYEOF'
          import json
          from pathlib import Path

          repo = "${{ github.repository }}"
          branch = "${{ github.ref_name }}"

          ready_path = Path("src/scripts/hooks/ready.ts")
          ready_text = ready_path.read_text(encoding="utf-8")
          start = "            // Proceed no further if forbidden modules are enabled\n"
          next_section = "            // Once the entire VTT framework is initialized"
          if start in ready_text:
              before, rest = ready_text.split(start, 1)
              if next_section not in rest:
                  raise SystemExit("Could not find ready.ts marker after forbidden-modules block")
              _, after = rest.split(next_section, 1)
              ready_path.write_text(before + next_section + after, encoding="utf-8")

          if "PF2E system halted: one or more of your modules are not supported." in ready_path.read_text(encoding="utf-8"):
              raise SystemExit("ready.ts still contains the forbidden-modules halt block")

          changelogs = {
              "pf2e": "CHANGELOG.md",
              "sf2e": "CHANGELOG%20(SF2E).md",
          }

          for system in ["pf2e", "sf2e"]:
              path = Path(f"system.{system}.json")
              if not path.is_file():
                  raise SystemExit(f"Missing manifest: {path}")

              with path.open(encoding="utf-8") as f:
                  data = json.load(f)

              version = data["version"]
              authors = data.get("authors")

              if not isinstance(version, str) or not version:
                  raise SystemExit(f"Manifest {path} has invalid version: {version!r}")
              if not isinstance(authors, list):
                  raise SystemExit(f"Manifest {path} has invalid authors list")

              expected_manifest = f"https://raw.githubusercontent.com/{repo}/{branch}/system.{system}.json"
              expected_download = f"https://github.com/{repo}/releases/download/{system}-{version}/system.zip"
              expected_changelog = f"https://github.com/{repo}/blob/{branch}/{changelogs[system]}"
              expected_url = f"https://github.com/{repo}"
              expected_bugs = f"https://github.com/{repo}/issues"

              data["manifest"] = expected_manifest
              data["download"] = expected_download
              data["changelog"] = expected_changelog
              data["url"] = expected_url
              data["bugs"] = expected_bugs
              for author in authors:
                  if isinstance(author, dict) and "url" in author:
                      author["url"] = author["url"].replace("foundryvtt/pf2e", repo)

              with path.open("w", encoding="utf-8") as f:
                  json.dump(data, f, indent=4, ensure_ascii=False)
                  f.write("\n")

              with path.open(encoding="utf-8") as f:
                  rewritten = json.load(f)

              checks = {
                  "manifest": expected_manifest,
                  "download": expected_download,
                  "changelog": expected_changelog,
                  "url": expected_url,
                  "bugs": expected_bugs,
              }
              for key, expected in checks.items():
                  actual = rewritten.get(key)
                  if actual != expected:
                      raise SystemExit(f"Manifest {path} failed validation for {key}: {actual!r} != {expected!r}")
          PYEOF

          git add -A
          git diff --cached --quiet || git commit -m "Sync upstream and apply fork patches"

      - name: Push changes
        run: git push origin

  release-pf2e:
    needs: [check, sync]
    if: needs.check.outputs.pf2e_needed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger and wait
        run: |
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RUN_NAME="System Release (pf2e)"
          gh workflow run release.yml --repo ${{ github.repository }} --ref "${{ github.ref_name }}" -f system=pf2e
          sleep 10
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh api repos/${{ github.repository }}/actions/workflows/release.yml/runs \
              --jq "[.workflow_runs[] | select(.created_at >= \"$BEFORE\" and .display_title == \"$RUN_NAME\")][0].id" 2>/dev/null || echo "")
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          [ -z "$RUN_ID" ] && { echo "Could not find triggered run"; exit 1; }
          gh run watch "$RUN_ID" --repo ${{ github.repository }} --exit-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy release notes from upstream
        run: |
          TAG="${{ needs.check.outputs.pf2e_tag }}"
          BODY=$(gh release view "$TAG" --repo foundryvtt/pf2e --json body -q .body 2>/dev/null || echo "")
          if [ -n "$BODY" ]; then
            for i in $(seq 1 6); do
              echo "$BODY" | gh release edit "$TAG" --repo ${{ github.repository }} --notes-file - && break
              sleep 10
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-sf2e:
    needs: [check, sync]
    if: needs.check.outputs.sf2e_needed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger and wait
        run: |
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RUN_NAME="System Release (sf2e)"
          gh workflow run release.yml --repo ${{ github.repository }} --ref "${{ github.ref_name }}" -f system=sf2e
          sleep 10
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh api repos/${{ github.repository }}/actions/workflows/release.yml/runs \
              --jq "[.workflow_runs[] | select(.created_at >= \"$BEFORE\" and .display_title == \"$RUN_NAME\")][0].id" 2>/dev/null || echo "")
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          [ -z "$RUN_ID" ] && { echo "Could not find triggered run"; exit 1; }
          gh run watch "$RUN_ID" --repo ${{ github.repository }} --exit-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy release notes from upstream
        run: |
          TAG="${{ needs.check.outputs.sf2e_tag }}"
          BODY=$(gh release view "$TAG" --repo foundryvtt/pf2e --json body -q .body 2>/dev/null || echo "")
          if [ -n "$BODY" ]; then
            for i in $(seq 1 6); do
              echo "$BODY" | gh release edit "$TAG" --repo ${{ github.repository }} --notes-file - && break
              sleep 10
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
